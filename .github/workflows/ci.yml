name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Problem catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
      - run: node tools/audit-problems.mjs

  bootstrap-unix:
    name: One-click startup (Unix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: bash tools/test-bootstrap-scripts.sh

  bootstrap-windows:
    name: One-click startup (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run start.cmd through Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\test-bootstrap-windows.ps1

  backend:
    name: Spring Boot
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21@sha256:3a4ab3276a087bf276f79cae96b1af04f53731bec53fb2e651aca79e4b10211e
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  renderer:
    name: Chromium judge
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - working-directory: renderer
        run: npm ci --no-audit --no-fund
      - working-directory: renderer
        run: npm audit --audit-level=high
      - working-directory: renderer
        run: npm test

  java-runner:
    name: Java sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker build --tag code-quest-java-runner:test java-runner

  javascript-runner:
    name: JavaScript sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker build --tag code-quest-javascript-runner:test javascript-runner

  integration:
    name: End-to-end grading contracts
    runs-on: ubuntu-latest
    needs: [catalog, backend, frontend, renderer, java-runner, javascript-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
      - name: Build a reproducible release ZIP from HEAD
        run: |
          tools/build-release-zip.sh
          first_hash="$(sha256sum code-quest.zip | awk '{ print $1 }')"
          tools/build-release-zip.sh
          second_hash="$(sha256sum code-quest.zip | awk '{ print $1 }')"
          test "$first_hash" = "$second_hash"
      - name: Extract the release into a path containing spaces
        run: |
          release_root="$RUNNER_TEMP/Code Quest release/code-quest"
          release_parent="$(dirname "$release_root")"
          mkdir -p "$release_parent"
          unzip -q code-quest.zip -d "$release_parent"
          test -x "$release_root/start.sh"
          test -x "$release_root/start.command"
          test ! -e "$release_root/.git"
          test ! -e "$release_root/.env"
          test ! -d "$release_root/frontend/node_modules"
          test ! -d "$release_root/frontend/dist"
          test ! -d "$release_root/backend/target"
      - name: Test bootstrap scripts from the release
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: bash tools/test-bootstrap-scripts.sh
      - name: Start the complete platform through the release entrypoint
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: |
          set -o pipefail
          CODE_QUEST_NO_OPEN=1 ./start.sh 2>&1 |
            tee "$RUNNER_TEMP/code-quest-first-start.log"
      - name: Verify generated secrets, idempotent restart, and public health
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: |
          env_value() {
            awk -F= -v key="$1" '
              $1 == key {
                print substr($0, index($0, "=") + 1)
                found = 1
              }
              END {
                if (!found) {
                  exit 1
                }
              }
            ' .env
          }

          postgres_password="$(env_value POSTGRES_PASSWORD)"
          java_token="$(env_value JAVA_RUNNER_TOKEN)"
          javascript_token="$(env_value JAVASCRIPT_RUNNER_TOKEN)"

          for generated_value in \
            "$postgres_password" \
            "$java_token" \
            "$javascript_token"; do
            printf '%s' "$generated_value" |
              grep -Eq '^[0-9a-f]{64}$'
          done

          test "$java_token" != "$javascript_token"
          test "$postgres_password" != "$java_token"
          test "$postgres_password" != "$javascript_token"
          test "$(stat -c '%a' .env)" = "600"

          env_hash_before="$(sha256sum .env | awk '{ print $1 }')"
          set -o pipefail
          CODE_QUEST_NO_OPEN=1 ./start.sh 2>&1 |
            tee "$RUNNER_TEMP/code-quest-second-start.log"
          env_hash_after="$(sha256sum .env | awk '{ print $1 }')"
          test "$env_hash_before" = "$env_hash_after"

          if grep -Fq -- "$java_token" \
            "$RUNNER_TEMP/code-quest-first-start.log" \
            "$RUNNER_TEMP/code-quest-second-start.log"; then
            echo "Java runner token was exposed in startup output" >&2
            exit 1
          fi
          if grep -Fq -- "$javascript_token" \
            "$RUNNER_TEMP/code-quest-first-start.log" \
            "$RUNNER_TEMP/code-quest-second-start.log"; then
            echo "JavaScript runner token was exposed in startup output" >&2
            exit 1
          fi

          curl --fail --silent http://localhost:3000/ >/dev/null
          curl --fail --silent http://localhost:8080/api/health \
            >"$RUNNER_TEMP/code-quest-health.json"
          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              health.status !== "UP"
              || health.problemCount !== 288
              || health.expectedProblemCount !== 288
            ) process.exit(1);
          ' "$RUNNER_TEMP/code-quest-health.json"
      - name: Verify every reference answer through the real judges
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        env:
          CODE_QUEST_AUDIT_WORKERS: "1"
        run: node tools/audit-reference-answers.mjs
      - name: Verify grading status, attempts, and solution exposure contracts
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: node tools/audit-grading-contracts.mjs cases
      - name: Verify concurrent attempt recording
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: node tools/audit-grading-contracts.mjs concurrency
      - name: Stop the renderer for the outage contract
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: docker compose stop --timeout 10 renderer
      - name: Verify renderer outage behavior
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: node tools/audit-grading-contracts.mjs renderer-outage
      - name: Restore the renderer
        if: always()
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: docker compose up --detach --wait --wait-timeout 60 renderer
      - name: Stop the JavaScript runner for the outage contract
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: docker compose stop --timeout 10 javascript-runner
      - name: Verify JavaScript runner outage behavior
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: node tools/audit-grading-contracts.mjs javascript-runner-outage
      - name: Restore the JavaScript runner
        if: always()
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: docker compose up --detach --wait --wait-timeout 60 javascript-runner
      - name: Verify the public web entrypoint
        working-directory: "${{ runner.temp }}/Code Quest release/code-quest"
        run: |
          curl --fail --silent http://localhost:3000/ >/dev/null
          curl --fail --silent http://localhost:3000/api/health >/dev/null
      - name: Capture final service diagnostics
        if: always()
        continue-on-error: true
        run: |
          release_root="$RUNNER_TEMP/Code Quest release/code-quest"
          if [ -d "$release_root" ]; then
            cd "$release_root"
            docker compose ps
            docker compose logs --no-color --tail=200
          fi
      - name: Stop the release platform and remove its volumes
        if: always()
        run: |
          release_root="$RUNNER_TEMP/Code Quest release/code-quest"
          if [ -d "$release_root" ]; then
            cd "$release_root"
            docker compose down --volumes
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - catalog
      - bootstrap-unix
      - bootstrap-windows
      - backend
      - frontend
      - renderer
      - java-runner
      - javascript-runner
      - integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
      - name: Test required job result handling
        run: node --test tools/verify-ci-results.test.mjs
      - name: Verify every required job succeeded
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/verify-ci-results.mjs
